/* 仪表盘 */
.dash{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.di{flex:1;min-width:90px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 10px;text-align:center}
.di .n{font-size:1.3em;font-weight:800}.di .l{font-size:0.62em;color:var(--muted);margin-top:2px}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:11px;margin-bottom:14px;overflow:hidden}
.card.star{border-left:3px solid var(--accent)}
.ch{display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid rgba(26,31,39,0.6);flex-wrap:wrap;font-size:0.85em}
.ch .lg{font-size:0.62em;padding:2px 6px;border-radius:7px;font-weight:600}
.lcl{background:#152433;color:#58a6ff}.lel{background:#2b1515;color:#f87171}.llc{background:#15281a;color:#3fb950}
.ch .cf{margin-left:auto;font-size:0.68em;font-weight:600}
.c-h{color:#3fb950}.c-m{color:#f0a838}.c-l{color:#6b7280}
.cb{padding:14px 16px}

/* 对阵 */
.mt{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px}
.mt .tn{font-size:1.15em;font-weight:700}
.mt .vs{font-size:0.7em;color:var(--muted);font-weight:600}
.mt .es{font-size:0.62em;color:var(--muted);display:block;font-weight:400}
.xgl{text-align:center;font-size:0.76em;color:var(--muted);margin-bottom:12px}
.xgl b{color:var(--accent)}

.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:12px}
@media(max-width:600px){.mg{grid-template-columns:repeat(2,1fr)}}
.mi{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 10px;text-align:center}
.mi .ml{font-size:0.62em;color:var(--muted);margin-bottom:2px}
.mi .mv{font-size:0.85em;font-weight:700}
.mi .ms{font-size:0.62em;color:var(--muted);margin-top:1px}
.mi.best{border-color:var(--accent);background:rgba(240,168,56,0.04)}
.mi.best .mv{color:var(--accent)}
.mi.best .ml{color:var(--accent)}

/* 分析 */
.an{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
@media(max-width:600px){.an{grid-template-columns:1fr}}
.ab{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:10px 12px;font-size:0.78em;line-height:1.6}
.ab .al{font-size:0.62em;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.of{display:flex;gap:4px;margin-bottom:6px;text-align:center}
.of span{flex:1;font-size:0.8em}
.of .od{color:var(--green)}.of .ou{color:var(--red)}.of .os{color:var(--muted)}

.bt .bl{font-size:0.62em;color:var(--accent);letter-spacing:1px}
.bt .bo{font-weight:800;color:var(--accent);font-size:1.05em}
.bt .br{font-size:0.78em;color:var(--muted);flex-basis:100%;margin-top:3px}

.ldg{margin-top:30px;border-top:2px solid var(--border);padding-top:20px}
.ldg h2{font-size:1.05em;margin-bottom:2px}.ldg em{color:var(--accent);font-style:normal}
.ldg .sub{font-size:0.7em;color:var(--muted);margin-bottom:14px}
.lt{width:100%;border-collapse:collapse;font-size:0.76em;margin-bottom:12px}
.lt th{color:var(--muted);font-weight:500;padding:7px 5px;border-bottom:1px solid var(--border);font-size:0.75em;text-align:center}
.lt td{padding:7px 5px;border-bottom:1px solid rgba(26,31,39,0.5);text-align:center}
.lt .pn{color:var(--accent);font-weight:600}
.lt .bp{color:var(--accent);font-weight:700}
.lsum{display:flex;gap:8px;flex-wrap:wrap;font-size:0.78em;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.lsum span{flex:1;text-align:center;min-width:70px}

.nt{background:rgba(240,168,56,0.03);border:1px solid rgba(240,168,56,0.08);border-radius:8px;padding:12px 16px;margin-top:16px;font-size:0.78em;color:var(--accent);text-align:center;line-height:1.6}
.ft{text-align:center;padding:20px;color:var(--muted);font-size:0.65em;border-top:1px solid var(--border);margin-top:14px}
</style>
</head>

    miHtml+='<div class="mi'+(bestIdx===0||bestIdx===1||bestIdx===2?' best':'')+'"><div class="ml">'+mk[0]+'</div><div class="mv">'+(bestIdx===0||bestIdx===1||bestIdx===2?'★ ':'')+mk[1]+'</div><div class="ms">'+mk[2]+'</div></div>';
    if(mk[3]) miHtml+='<div class="mi'+(bestIdx===1?' best':'')+'"><div class="ml">'+mk[0]+'</div><div class="mv">'+(bestIdx===1?'★ ':'')+mk[3]+'</div><div class="ms">'+mk[4]+'</div></div>';
    if(mk[5]) miHtml+='<div class="mi'+(bestIdx===2?' best':'')+'"><div class="ml">'+mk[0]+'</div><div class="mv">'+(bestIdx===2?'★ ':'')+mk[5]+'</div><div class="ms">'+mk[6]+'</div></div>';
  }

  var ofHtml='';
  for(var k=0;k<m.flow.length;k++){
    var f=m.flow[k],cls=f.d==='↓'?'od':f.d==='↑'?'ou':'os';
    ofHtml+='<span class="'+cls+'">'+f.v+' '+f.d+'</span>';
  }

  cardsHtml+=
  '<div class="card'+(m.star?' star':'')+'">'+
    '<div class="ch"><b style="color:'+(rank<=3?'var(--accent)':'var(--muted)')+'">#'+rank+'</b> <span class="lg '+m.lgc+'">'+m.lg+'</span> <b style="font-size:0.75em">'+m.time+'</b> '+m.h+' vs '+m.a+' <span style="font-size:0.72em;color:var(--muted)">ELO '+m.elo+' · '+m.ah+'</span><span class="cf '+m.cfc+'" style="margin-left:auto">'+m.cf+'信心 '+m.cfv+'%</span></div>'+
    '<div class="cb">'+
      '<div class="mt"><span class="tn">'+m.h+'<span class="es"> 🏠</span></span><span class="vs">VS</span><span class="tn">'+m.a+'<span class="es"> 🛫</span></span></div>'+
      '<div class="xgl">xG <b>'+m.xg+'</b> · 总球 <b>'+m.tg+'</b> · 最可能 <b>'+m.ts+'</b> ('+m.ts2+')</div>'+
      '<div class="mg">'+miHtml+'</div>'+
      '<div class="an">'+
        '<div class="ab"><div class="al">📈 赔率走势 (初→临)</div><div class="of">'+ofHtml+'</div><div style="color:var(--muted)">'+m.fn+'</div></div>'+
        '<div class="ab"><div class="al">🔬 模型分析</div>'+m.an+'</div>'+
      '</div>'+
      '<div class="bt"><span class="bl">💰 最佳投注</span><span>'+m.bet[0]+' —</span><span class="bo">'+m.bet[1]+' @'+m.bet[2]+'</span><span style="color:var(--muted)">· 100</span><div class="br">'+m.bet[3]+'</div></div>'+
    '</div></div>';
}
document.getElementById('cards').innerHTML=cardsHtml;

var th=M.filter(function(m){return m.cf==='高'}).length;
var tm=M.filter(function(m){return m.cf==='中'}).length;
var tl=M.filter(function(m){return m.cf==='低'}).length;
var avgO=(M.reduce(function(s,m){return s+parseFloat(m.bet[2])},0)/M.length).toFixed(2);

document.getElementById('dash').innerHTML=
  '<div class="di"><div class="n">'+M.length+'</div><div class="l">总场次</div></div>'+
  '<div class="di"><div class="n" style="color:var(--accent)">'+(M.length*100)+'</div><div class="l">总投注额</div></div>'+
  '<div class="di"><div class="n" style="color:var(--green)">'+th+'</div><div class="l">高信心 ⭐</div></div>'+
  '<div class="di"><div class="n" style="color:var(--accent)">'+tm+'</div><div class="l">中信心</div></div>'+
  '<div class="di"><div class="n" style="color:var(--muted)">'+tl+'</div><div class="l">低信心</div></div>'+
  '<div class="di"><div class="n" style="color:var(--blue)">'+avgO+'</div><div class="l">平均赔率</div></div>';

var lr='';
for(var i=0;i<M.length;i++){
  var m=M[i];
  lr+='<tr><td>'+(i+1)+'</td><td>'+m.time+'</td><td>'+m.lg+'</td><td>'+m.h+' vs '+m.a+'</td><td>'+m.bet[0]+'</td><td class="bp">'+m.bet[1]+'</td><td>'+m.bet[2]+'</td><td>100</td><td style="color:'+(m.cf==='高'?'var(--green)':m.cf==='中'?'var(--accent)':'var(--muted)')+'">'+m.cf+'</td><td class="pn">⏳</td><td>—</td></tr>';
}
document.getElementById('ledger').innerHTML=lr;

var expHits=M.filter(function(m){return m.cf==='高'}).length+Math.round(M.filter(function(m){return m.cf==='中'}).length*0.55)+Math.round(M.filter(function(m){return m.cf==='低'}).length*0.3);
document.getElementById('lsum').innerHTML=
  '<span>📋 <b>8</b> 注</span><span>💵 总投 <b>800</b></span><span>📊 均赔 <b>'+avgO+'</b></span><span>⭐ 高信 <b>'+th+'</b> 场</span><span>🎯 预计命中 <b>'+expHits+'</b> 场</span><span>📈 预期回报 <b>+200~+500</b></span>';
</script>
</body>
</html>
