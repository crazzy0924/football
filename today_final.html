<script>
function pois(k,l){if(l<=0)return k===0?1:0;var v=-l+k*Math.log(l);for(var i=2;i<=k;i++)v-=Math.log(i);return Math.exp(v)}
function mc(hAtt,hDef,aAtt,aDef,hAdv,avg,crB){
  crB=crB||9.5;var b=avg/2,g=1+hAdv,lh=Math.max(0.1,Math.min(6,b*hAtt*aDef*g)),la=Math.max(0.1,Math.min(6,b*aAtt*hDef));
  var M=8,hP=[],aP=[];for(var i=0;i<=M;i++){hP.push(pois(i,lh));aP.push(pois(i,la))}
  var hw=0,dr=0,aw=0,s=[],tg=0;
  for(var i=0;i<=M;i++)for(var j=0;j<=M;j++){var p=hP[i]*aP[j];tg+=p*(i+j);if(i>j)hw+=p;else if(i===j)dr+=p;else aw+=p;s.push({h:i,a:j,p:p})}

  for(var k=0;k<s.length;k++){if(s[k].h+s[k].a>2.5)o25+=s[k].p}
  var h1r=0.42,lh1=lh*h1r,la1=la*h1r,lh2=lh*(1-h1r),la2=la*(1-h1r);
  var h1P=[],a1P=[],h2P=[],a2P=[];for(var i=0;i<=M;i++){h1P.push(pois(i,lh1));a1P.push(pois(i,la1));h2P.push(pois(i,lh2));a2P.push(pois(i,la2))}
  var h1o15=0,h2o15=0;for(var i=0;i<=M;i++)for(var j=0;j<=M;j++){if(i+j>1.5)h1o15+=h1P[i]*a1P[j];if(i+j>1.5)h2o15+=h2P[i]*a2P[j]}
  var cr=Math.round(crB+avg*0.3),hc=Math.round(cr*0.55*(0.9+hAtt*0.1)),ac=Math.round(cr*0.45*(0.9+aAtt*0.1));
  return{hw:hw,dr:dr,aw:aw,xH:+lh.toFixed(2),xA:+la.toFixed(2),tg:+tg.toFixed(2),
    top:s[0].h+"-"+s[0].a,o25:o25,h1o15:h1o15,h2o15:h2o15,
    h1d:lh1-la1,h2d:lh2-la2,cr:{h:hc,a:ac,t:hc+ac},lh:lh,la:la}
}
function ea(e){var s=(e-1500)/400;return Math.max(0.5,+(1+s*0.6).toFixed(2))}

  {id:"e3",h:"阿尔塔赫",a:"蒂罗尔",t:"01:30",cf:"中",ods:{h:2.08,d:3.20,a:3.45},bet:["大小球","小2.5","1.62"],r:"奥甲. 小2.5仅1.62=市场极度看好小球. 奥甲小球联赛."},

for(var g=0;g<DATA.length;g++){var lg=DATA[g],lp=LP[lg.lg]||LP.LC;
  tabs+='<div class="tab'+(g===0?' on':'')+'" onclick="switchLg(\''+lg.lg+'\')">'+lg.n+' ('+lg.ms.length+'场)</div>';
  var rows='';
  for(var i=0;i<lg.ms.length;i++){var m=lg.ms[i];cnt++;var eH=ELO[m.h]||1500,eA=ELO[m.a]||1500;
    var s=mc(ea(eH),ed(eH),ea(eA),ed(eA),lp.ha,lp.a,lp.crB);
    var maxP=Math.max(s.hw,s.dr,s.aw);sumC+=maxP;
    var pick,pc;if(s.hw>=s.aw&&s.hw>=s.dr){pick="主胜";pc="th"}else if(s.aw>=s.hw&&s.aw>=s.dr){pick="客胜";pc="ta"}else{pick="平局";pc="td"}

    var h1Label=s.h1o15>0.5?"大":s.h1o15>0.35?"偏大":"小";
    var h2Label=s.h2o15>0.5?"大":s.h2o15>0.35?"偏大":"小";
    var kambiNote=m.ods.h?"Kambi":"估";
    rows+='<tr><td>'+m.t+'</td><td class="l mw"><b>'+m.h+' vs '+m.a+'</b></td>'+
      '<td><span class="tag '+pc+'">'+pick+'</span><br><span style="font-size:0.55em;color:var(--muted)">'+(s.hw*100).toFixed(0)+'/'+(s.dr*100).toFixed(0)+'/'+(s.aw*100).toFixed(0)+'%</span></td>'+
