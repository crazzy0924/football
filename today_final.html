function pois(k,l){if(l<=0)return k===0?1:0;var v=-l+k*Math.log(l);for(var i=2;i<=k;i++)v-=Math.log(i);return Math.exp(v)}
function mc(hAtt,hDef,aAtt,aDef,hAdv,avg,crB){
  crB=crB||9.5;var b=avg/2,g=1+hAdv,lh=Math.max(0.1,Math.min(6,b*hAtt*aDef*g)),la=Math.max(0.1,Math.min(6,b*aAtt*hDef));
  var M=8,hP=[],aP=[];for(var i=0;i<=M;i++){hP.push(pois(i,lh));aP.push(pois(i,la))}
  var hw=0,dr=0,aw=0,s=[],tg=0;
  for(var i=0;i<=M;i++)for(var j=0;j<=M;j++){var p=hP[i]*aP[j];tg+=p*(i+j);if(i>j)hw+=p;else if(i===j)dr+=p;else aw+=p;s.push({h:i,a:j,p:p})}
  s.sort(function(a,b){return b.p-a.p});var o25=0,o35=0;
  for(var k=0;k<s.length;k++){var x=s[k];if(x.h+x.a>2.5)o25+=x.p;if(x.h+x.a>3.5)o35+=x.p}
  var h1r=0.42,lh1=lh*h1r,la1=la*h1r,lh2=lh*(1-h1r),la2=la*(1-h1r);
  var h1P=[],a1P=[],h2P=[],a2P=[];for(var i=0;i<=M;i++){h1P.push(pois(i,lh1));a1P.push(pois(i,la1));h2P.push(pois(i,lh2));a2P.push(pois(i,la2))}
  var h1o15=0,h2o15=0;for(var i=0;i<=M;i++)for(var j=0;j<=M;j++){if(i+j>1.5)h1o15+=h1P[i]*a1P[j];if(i+j>1.5)h2o15+=h2P[i]*a2P[j]}
  var cr=Math.round(crB+avg*0.3),hc=Math.round(cr*0.55*(0.9+hAtt*0.1)),ac=Math.round(cr*0.45*(0.9+aAtt*0.1));
  return{hw:hw,dr:dr,aw:aw,xH:+lh.toFixed(2),xA:+la.toFixed(2),tg:+tg.toFixed(2),
    top:s[0].h+"-"+s[0].a,o25:o25,o35:o35,h1o15:h1o15,h2o15:h2o15,
    h1d:lh1-la1,h2d:lh2-la2,cr:{h:hc,a:ac,t:hc+ac},lh:lh,la:la}
}

  {id:2,h:"萨尔茨堡红牛",a:"帕福斯",t:"01:00",ah:"萨尔茨堡 -1.0",cf:"中",ods:{h:1.50,d:4.20,a:5.40},bet:["大小球","小 2.5","2.14"],r:"ELO+220 亚盘升盘-0.75→-1.0 帕福斯客场5连小 大小球大Vvs市场矛盾→追大V逻辑"},
  {id:3,h:"比亚韦斯托克",a:"格拉斯哥流浪者",t:"01:00",ah:"流浪者 -0.25",cf:"中",ods:{h:3.10,d:3.40,a:2.15},bet:["胜平负","客胜","2.15"],r:"ELO-120 流浪者不败@1.32 主队联赛2连胜 客胜博"},
  {id:4,h:"赫拉德茨克拉洛韦",a:"贝西克塔斯",t:"02:00",ah:"贝西克塔斯 -0.5",cf:"中",ods:{h:4.20,d:3.60,a:1.82},bet:["让球","贝西克塔斯 -0.5","1.82"],r:"ELO-130 捷克队实力有限 客胜方向明确 0.5盘博"},

  {id:10,h:"拉科夫",a:"哈马比",t:"01:00",ah:"平手",cf:"低",ods:{h:2.27,d:3.40,a:3.38},bet:["大小球","大 2.5","1.90"],r:"ELO-40 最均衡 方向不明确 瑞典队开放风格→追大球"},
  {id:11,h:"克卢日",a:"特罗姆瑟",t:"02:00",ah:"平手",cf:"低",ods:{h:2.79,d:3.38,a:2.60},bet:["参考","不投注","—"],r:"ELO+30 五五开 ECL数据稀缺→参考"},
  {id:12,h:"谢里夫",a:"圣加仑",t:"01:00",ah:"圣加仑 -0.25",cf:"低",ods:{h:3.90,d:3.40,a:2.05},bet:["大小球","小 2.5","1.86"],r:"ELO-100 摩尔多瓦主场 小球倾向"},
  {id:13,h:"里加",a:"吉奥利",t:"20:00",ah:"平手",cf:"低",ods:{h:2.10,d:3.40,a:3.40},bet:["参考","不投注","—"],r:"ELO+30 ECL样本少 数据稀缺→参考"},
]}];

var tabs='',allRows={},ledgerRows='',cnt=0,stake=0,sumC=0,formal=0;
for(var g=0;g<DATA.length;g++){var lg=DATA[g],lp=LP[lg.lg];
  tabs+='<div class="tab'+(g===0?' on':'')+'" onclick="switchLg(\''+lg.lg+'\')">'+lg.n+' ('+lg.ms.length+'场)</div>';
  var rows='';
  for(var i=0;i<lg.ms.length;i++){var m=lg.ms[i];cnt++;var eH=ELO[m.h]||1500,eA=ELO[m.a]||1500;
    var s=mc(ea(eH),ed(eH),ea(eA),ed(eA),lp.ha,lp.a,lp.crB);
    var maxP=Math.max(s.hw,s.dr,s.aw);sumC+=maxP;
    var pick,pc;if(s.hw>=s.aw&&s.hw>=s.dr){pick="主胜";pc="th"}else if(s.aw>=s.hw&&s.aw>=s.dr){pick="客胜";pc="ta"}else{pick="平局";pc="td"}
    var ou=s.o25>0.55?"大":s.o25>0.45?"偏大":"小";
    var ouC=s.o25>0.55?"#1a8a3f":s.o25>0.45?"#e67e00":"#d32f2f";
    var h1Ah=Math.abs(s.h1d)<0.12?"平手":s.h1d>0.5?m.h+" -0.5":s.h1d>0.2?m.h+" -0.25":s.h1d<-0.5?m.a+" -0.5":s.h1d<-0.2?m.a+" -0.25":"平手";
    var h2Ah=Math.abs(s.h2d)<0.12?"平手":s.h2d>0.7?m.h+" -0.75":s.h2d>0.3?m.h+" -0.5":s.h2d<-0.7?m.a+" -0.75":s.h2d<-0.3?m.a+" -0.5":"平手";
    var h1Label=s.h1o15>0.5?"大":s.h1o15>0.35?"偏大":"小";
    var h2Label=s.h2o15>0.5?"大":s.h2o15>0.35?"偏大":"小";
    var h1Color=s.h1o15>0.5?"#1a8a3f":s.h1o15>0.35?"#e67e00":"#d32f2f";
    var h2Color=s.h2o15>0.5?"#1a8a3f":s.h2o15>0.35?"#e67e00":"#d32f2f";
    rows+='<tr><td>'+m.t+'</td><td class="l mw"><b>'+m.h+' vs '+m.a+'</b><span class="sub">'+m.ah+'</span></td>'+
      '<td><span class="tag '+pc+'">'+pick+'</span><br><span style="font-size:0.55em;color:var(--muted)">主'+(s.hw*100).toFixed(0)+'%平'+(s.dr*100).toFixed(0)+'%客'+(s.aw*100).toFixed(0)+'%</span></td>'+

      '<td style="color:var(--blue);font-weight:600;font-size:0.65em">'+h1Ah+'</td>'+
      '<td style="font-size:0.65em">'+s.cr.t+'角<br><span style="font-size:0.55em;color:var(--muted)">'+s.cr.h+'/'+s.cr.a+'</span></td>'+
      '<td><span class="tag '+pc+'">'+m.bet[1]+'</span><br><span class="odds">@'+m.bet[2]+'</span></td>'+

  }
}
document.getElementById('tabs').innerHTML=tabs;
document.getElementById('tb').innerHTML=allRows[DATA[0].lg];
document.getElementById('ledger').innerHTML=ledgerRows;
var avgC=Math.round(sumC/cnt),hc=DATA.reduce(function(s,lg){return s+lg.ms.filter(function(m){return m.cf=="高"}).length},0);
document.getElementById('lsum').innerHTML='<span>📋 <b>'+formal+'</b> 注(正式)</span><span>💵 总投 <b>'+stake+'</b></span><span>🎯 均置信 <b>'+avgC+'%</b></span><span>⭐高 <b>'+hc+'</b> 场</span><span>🔬 EL+75/ECL+70</span><span>📊 13场全量</span>';

</script>
