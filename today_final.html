      '<td><span style="font-weight:600;color:'+(s.h2o15>0.5?'#1a8a3f':s.h2o15>0.35?'#e67e00':'#d32f2f')+'">'+h2Label+'1.5 '+(s.h2o15*100).toFixed(0)+'%</span></td>'+
      '<td style="color:var(--blue);font-weight:600;font-size:0.6em">'+h1Ah+'</td>'+
      '<td style="font-size:0.6em">'+s.cr.t+'角<br><span style="font-size:0.5em;color:var(--muted)">'+s.cr.h+'/'+s.cr.a+'</span></td>'+
      '<td><span class="tag '+pc+'">'+m.bet[1]+'</span><br><span class="odds">@'+m.bet[2]+'</span></td>'+
      '<td>'+srcTag+'</td></tr>';
  }
  allRows[lg.lg]=rows;
  for(var i=0;i<lg.ms.length;i++){var m=lg.ms[i];if(m.bet[1]==="不投注")continue;formal++;stake+=100;
    ledgerRows+='<tr><td>'+formal+'</td><td>'+m.t+'</td><td>'+lg.n+'</td><td class="l">'+m.h+' vs '+m.a+'</td><td>'+m.bet[0]+'</td><td style="font-weight:600;color:#e67e00">'+m.bet[1]+'</td><td>'+m.bet[2]+'</td><td style="font-weight:600;color:'+(m.cf=="高"?"#1a8a3f":m.cf=="中"?"#e67e00":"#999")+'">'+m.cf+'</td><td style="font-size:0.56em;color:var(--muted)">'+m.r.substring(0,35)+'</td></tr>';
  }
}
document.getElementById('tabs').innerHTML=tabs;
document.getElementById('tb').innerHTML=allRows[DATA[0].lg];
document.getElementById('ledger').innerHTML=ledgerRows;
document.getElementById('lsum').innerHTML='<span>📋 <b>'+formal+'</b> 注(正式)</span><span>💵 <b>'+stake+'</b></span><span>📊 37场全量</span><span>✅ Kambi赛程</span><span>⚡ 22:00终盘</span>';
function switchLg(lg){document.getElementById('tb').innerHTML=allRows[lg];document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.textContent.indexOf(lg)>=0)});}
</script>
